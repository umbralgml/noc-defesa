# Compila o app Android (Capacitor) com o jogo empacotado dentro.
# Sempre gera um APK de teste (debug). Com os segredos da chave de upload, gera também o AAB assinado da Play Store.
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'src/**', 'app-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'src/**', 'app-android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Validar fases
        run: node tools/validar-fases.mjs

      - name: Copiar o jogo para o app
        working-directory: app-android
        run: npm ci && npm run sync

      - name: Versão (do changelog) e número do build
        run: |
          echo "NOC_VERSION_NAME=$(node -p "require('./src/changelog.json').versions[0].v")" >> "$GITHUB_ENV"
          echo "NOC_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Chave de upload
        env:
          KS_B64: ${{ secrets.NOC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NOC_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Sem os segredos da chave: o AAB sai sem assinatura (só o APK de teste serve)."
          fi

      - name: Compilar APK de teste e AAB da Play Store
        working-directory: app-android/android
        env:
          NOC_KEYSTORE_PASS: ${{ secrets.NOC_KEYSTORE_PASS }}
          NOC_KEY_ALIAS: ${{ secrets.NOC_KEY_ALIAS }}
          NOC_KEY_PASS: ${{ secrets.NOC_KEY_PASS }}
        run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: noc-apk-teste-${{ env.NOC_VERSION_NAME }}-${{ env.NOC_VERSION_CODE }}
          path: app-android/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: noc-playstore-aab-${{ env.NOC_VERSION_NAME }}-${{ env.NOC_VERSION_CODE }}
          path: app-android/android/app/build/outputs/bundle/release/*.aab
