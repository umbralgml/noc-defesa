# /etc/nginx/snippets/noc-defesa-api.conf  (incluído no server do jogo pelo deploy/install.sh)
# Publica a API do ranking em https://SEU-DOMINIO/rest/v1/ (mesmo caminho do Supabase).
location ^~ /rest/v1/ {
    limit_req zone=noc_api burst=40 nodelay;
    limit_req zone=noc_post burst=10 nodelay;
    limit_req_status 429;
    limit_except GET POST OPTIONS { deny all; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
