# /etc/nginx/conf.d/noc-defesa-api-zone.conf  (contexto http)
# Limites por IP: leitura folgada; gravação (POST) bem mais apertada para segurar spam no ranking.
map $request_method $noc_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $binary_remote_addr zone=noc_api:10m rate=10r/s;
limit_req_zone $noc_post_key zone=noc_post:10m rate=20r/m;
